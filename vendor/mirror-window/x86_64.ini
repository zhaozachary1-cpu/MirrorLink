[binaries]
c = ['/usr/bin/clang', '-arch', 'x86_64', '-mmacosx-version-min=13.0']
objc = ['/usr/bin/clang', '-arch', 'x86_64', '-mmacosx-version-min=13.0']
ar = '/usr/bin/ar'
strip = '/usr/bin/strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'darwin'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
